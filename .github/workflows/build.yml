name: build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('UPSTREAM_REF', 'overlay/**/*.ini') }}
      - name: Host test
        run: g++ -std=c++17 -Wall -Wextra -Werror -I overlay/src/modules/optional/ButtonMessage test/test_logic.cpp -o /tmp/test_logic && /tmp/test_logic
      - name: Build firmware
        run: ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: trailsafe-${{ github.sha }}
          path: dist/*.uf2
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.uf2 --generate-notes
